# Configuración de Netlify para el Generador de Informes OyM.
#
# No hay proceso de compilación: la aplicación es un solo archivo HTML.
# Netlify solo tiene que instalar las dependencias de la función serverless
# (lo hace solo al encontrar el package.json de la raíz) y publicar "public".

[build]
  publish = "public"
  functions = "netlify/functions"

# Entrar al dominio a secas abre el generador, sin escribir el nombre del
# archivo. El 200 es una reescritura: la URL que ve el técnico sigue siendo
# la raíz, y el enlace antiguo /GeneradorOyM.html también sigue funcionando.
[[redirects]]
  from = "/"
  to = "/GeneradorOyM.html"
  status = 200

[functions]
  node_bundler = "esbuild"

# El service worker nunca se cachea: si el navegador se queda con una copia
# vieja, el técnico puede seguir viendo una versión antigua de la app durante
# días sin enterarse.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Los iconos y el logo sí: llevan nombre fijo y cambian muy de vez en cuando.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
